name: HUB News

on:
  # Auto-push 5 phút/lần đã chuyển sang Cloudflare Workers Cron Trigger (*/5 * * * *)
  # để chạy đúng chu kỳ 5 phút thật (không bị GitHub Actions free-tier delay) và tránh gửi trùng lặp.
  workflow_dispatch:
    inputs:
      test:
        description: 'Nhập "true" để gửi 1 thẻ tin kiểm tra mẫu về Admin'
        required: false
        default: 'false'
      setup_bot:
        description: 'Nhập "true" để đồng bộ nút Menu & danh sách lệnh Telegram'
        required: false
        default: 'false'

concurrency:
  group: buh-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run HUB News
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          if [ "${{ github.event.inputs.setup_bot }}" = "true" ]; then
            python monitor.py --setup-bot
          elif [ "${{ github.event.inputs.test }}" = "true" ]; then
            python monitor.py --test
          else
            python monitor.py
          fi

      - name: Save seen state
        run: |
          git config user.name "buh-monitor-bot"
          git config user.email "buh-monitor-bot@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "Update seen state"
            git pull --rebase --autostash origin main || true
            git push
          fi
