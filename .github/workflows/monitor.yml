name: HUB Monitor Pro

on:
  schedule:
    # Quét tự động toàn hệ sinh thái HUB mỗi 5 phút (mức nhanh nhất GitHub hỗ trợ)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Nhập "true" để gửi thẻ tin mẫu + Bảng điều khiển Menu qua Telegram'
        required: false
        default: 'false'
      setup_bot:
        description: 'Nhập "true" để đăng ký lại nút Menu xanh & danh sách lệnh Telegram'
        required: false
        default: 'false'

concurrency:
  group: buh-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run HUB Monitor Pro
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_HTTTQL_RSS_URL: ${{ secrets.FB_HTTTQL_RSS_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.setup_bot }}" = "true" ]; then
            python monitor.py --setup-bot
          elif [ "${{ github.event.inputs.test }}" = "true" ]; then
            python monitor.py --test
          else
            python monitor.py
          fi

      - name: Save seen state
        run: |
          git config user.name "buh-monitor-bot"
          git config user.email "buh-monitor-bot@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "Update seen state"
            git pull --rebase --autostash origin main || true
            git push
          fi
